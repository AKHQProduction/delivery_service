services:
  admin_bot:
    container_name: "water_delivery-admin_bot"
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    command: [ "python", "-m", "backend.bootstrap.entrypoints.bot" ]
    restart: on-failure
    volumes:
      - ./backend/src:/usr/src/app/src
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  api:
    container_name: "water-delivery-api"
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    stop_signal: SIGINT
    restart: always
    volumes:
      - ./backend/src:/usr/src/app/src
    command: [ "uvicorn", "backend.bootstrap.entrypoints.api:create_app", "--host", "${SERVER_HOST}", "--port", "${SERVER_PORT}", "--factory" ]
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started

  redis:
    container_name: "water_delivery-redis"
    image: redis:8-alpine
    restart: unless-stopped
    env_file:
      - .env
    command: [ "redis-server", "--port", "${REDIS_PORT}", "--requirepass", "${REDIS_PASSWORD}" ]
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli", "-a", "$${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - redis_data:/data

  postgres:
    container_name: "water_delivery-postgres"
    image: postgres:18-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./scripts:/scripts
    env_file:
      - .env
    ports:
      - "${POSTGRES_INTERNAL_PORT}:${POSTGRES_PORT}"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  migration:
    container_name: "water_delivery-migration"
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: on-failure
    env_file:
      - .env
    depends_on:
      admin_bot:
        condition: service_started
      postgres:
        condition: service_healthy
    command: [ "alembic", "upgrade", "head" ]
    volumes:
      - ./backend/src:/usr/src/app/src

  otel-collector:
    container_name: "water_delivery-otel-collector"
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: [ "--config=/etc/otel-collector.yml" ]
    volumes:
      - ./configs/otel-collector.yml:/etc/otel-collector.yml:ro
    depends_on:
      - victoriametrics
      - loki
      - tempo
    restart: unless-stopped

  victoriametrics:
    container_name: "water_delivery-victoriametrics"
    image: victoriametrics/victoria-metrics:v1.106.1
    command:
      - "--storageDataPath=/victoria-metrics-data"
      - "--httpListenAddr=:8428"
      - "--retentionPeriod=30d"
    volumes:
      - victoriametrics_data:/victoria-metrics-data
    ports:
      - "8428:8428"
    restart: unless-stopped

  loki:
    container_name: "water_delivery-loki"
    image: grafana/loki:3.3.2
    command: [ "-config.file=/etc/loki/loki.yml" ]
    volumes:
      - ./configs/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  tempo:
    container_name: "water_delivery-tempo"
    image: grafana/tempo:2.6.1
    user: "0"
    command: [ "-config.file=/etc/tempo/tempo.yml" ]
    volumes:
      - ./configs/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/tmp/tempo
    ports:
      - "3200:3200"
    restart: unless-stopped

  grafana:
    container_name: "water_delivery-grafana"
    image: grafana/grafana:11.4.0
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./configs/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - victoriametrics
      - loki
      - tempo
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  victoriametrics_data:
  loki_data:
  tempo_data:
  grafana_data:
