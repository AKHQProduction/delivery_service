services:
  admin_bot:
    container_name: "water_delivery-admin_bot"
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    command: [ "python", "-m", "backend.bootstrap.entrypoints.bot" ]
    restart: on-failure
    volumes:
      - ./backend/src:/usr/src/app/src
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  api:
    container_name: "water-delivery-api"
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    stop_signal: SIGINT
    restart: always
    volumes:
      - ./backend/src:/usr/src/app/src
    command: [ "uvicorn", "backend.bootstrap.entrypoints.api:create_app", "--host", "${SERVER_HOST}", "--port", "${SERVER_PORT}", "--factory", "--reload" ]
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    depends_on:
      postgres:
        condition: service_healthy

  taskiq_worker:
    container_name: "water_delivery-taskiq_worker"
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    restart: on-failure
    volumes:
      - ./backend/src:/usr/src/app/src
    command: >
      taskiq worker --ack-type when_saved
      backend.bootstrap.entrypoints.taskiq:setup_taskiq_broker
      backend.infrastructure.tasks
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  taskiq_scheduler:
    container_name: "water_delivery-taskiq_scheduler"
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    restart: on-failure
    volumes:
      - ./backend/src:/usr/src/app/src
    command: >
      taskiq scheduler --skip-first-run --update-interval 300
      backend.bootstrap.entrypoints.taskiq:setup_taskiq_scheduler
      backend.infrastructure.tasks
    depends_on:
      redis:
        condition: service_healthy
      taskiq_worker:
        condition: service_started

  redis:
    container_name: "water_delivery-redis"
    image: redis:8-alpine
    restart: unless-stopped
    env_file:
      - .env
    command: [ "redis-server", "--port", "${REDIS_PORT}", "--requirepass", "${REDIS_PASSWORD}" ]
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - redis_data:/data

  postgres:
    container_name: "water_delivery-postgres"
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts:/scripts
    env_file:
      - .env
    ports:
      - "${POSTGRES_INTERNAL_PORT}:${POSTGRES_PORT}"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  migration:
    container_name: "water_delivery-migration"
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: on-failure
    env_file:
      - .env
    depends_on:
      admin_bot:
        condition: service_started
      postgres:
        condition: service_healthy
    command: [ "alembic", "upgrade", "head" ]
    volumes:
      - ./backend/src:/usr/src/app/src

  webapp:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    working_dir: /home/node/app
    stop_signal: SIGINT
    volumes:
      - ./frontend:/home/node/app
      - node_modules_volumes:/home/node/app/node_modules
    env_file:
      - .env
    command: [ "npm", "run", "dev", "--host" ]
    depends_on:
      - api
      - admin_bot

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - reverse-proxy

  reverse-proxy:
    depends_on:
      - webapp
      - admin_bot
      - api
    stop_signal: SIGINT
    restart: always
    image: nginx:latest
    volumes:
      - ./nginx/nginx-dev.conf:/etc/nginx/conf.d/default.conf

  osrm:
    container_name: "water_delivery-osrm"
    image: osrm/osrm-backend
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "${OSRM_PORT:-5000}:5000"
    volumes:
      - ./osrm-data:/data
    command: osrm-routed --algorithm mld --port 5000 /data/ukraine-latest.osrm
    profiles: ["map"]


  nominatim:
    container_name: "water_delivery-nominatim"
    image: mediagis/nominatim:5.2
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "${NOMINATIM_PORT:-8088}:8080"
    environment:
      PBF_PATH: /nominatim/data/ukraine-latest.osm.pbf
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:-nominatim}
    volumes:
      - ./osrm-data/ukraine-latest.osm.pbf:/nominatim/data/ukraine-latest.osm.pbf
      - nominatim_data:/var/lib/postgresql/16/main
    shm_size: 1g
    profiles: ["map"]

  otel-collector:
    container_name: "water_delivery-otel-collector"
    image: otel/opentelemetry-collector-contrib:0.117.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./configs/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "${OTEL_COLLECTOR_PORT}:4317"
    restart: unless-stopped
    profiles: ["monitoring"]

  postgres_exporter:
    container_name: "water_delivery-postgres_exporter"
    image: prometheuscommunity/postgres-exporter:latest
    env_file:
      - .env
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["monitoring"]

  redis_exporter:
    container_name: "water_delivery-redis_exporter"
    image: oliver006/redis_exporter:latest
    env_file:
      - .env
    environment:
      REDIS_ADDR: "redis:${REDIS_PORT}"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["monitoring"]


  loki:
    container_name: "water_delivery-loki"
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./configs/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    restart: unless-stopped
    profiles: ["monitoring"]

  tempo:
    container_name: "water_delivery-tempo"
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo/tempo-config.yaml"]
    volumes:
      - ./configs/tempo/tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "${TEMPO_PORT:-3200}:3200"
    restart: unless-stopped
    profiles: ["monitoring"]

  victoria_metrics:
    container_name: "water_delivery-victoria_metrics"
    image: victoriametrics/victoria-metrics:v1.106.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--storageDataPath=/storage"
      - "--httpListenAddr=:8428"
      - "--retentionPeriod=7d"
      - "--promscrape.config=/etc/prometheus/prometheus.yml"
    volumes:
      - victoria_metrics_data:/storage
      - ./configs/vm/scrape.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${VICTORIA_METRICS_PORT}:8428"
    restart: unless-stopped
    depends_on:
      - postgres_exporter
      - redis_exporter
    profiles: ["monitoring"]

  grafana:
    container_name: "water_delivery-grafana"
    image: grafana/grafana:11.4.0
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./configs/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "${GRAFANA_PORT}:3000"
    restart: unless-stopped
    depends_on:
      - victoria_metrics
      - loki
      - tempo
    profiles: ["monitoring"]

volumes:
  node_modules_volumes:
  redis_data:
  postgres_data:
  grafana_data:
  victoria_metrics_data:
  loki_data:
  tempo_data:
  nominatim_data:
