services:
  admin_bot:
    container_name: "water_delivery-admin_bot"
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    command: [ "python", "-m", "backend.bootstrap.entrypoints.bot" ]
    restart: on-failure
    volumes:
      - ./backend/src:/usr/src/app/src
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  api:
    container_name: "water-delivery-api"
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    stop_signal: SIGINT
    restart: always
    volumes:
      - ./backend/src:/usr/src/app/src
    command: [ "uvicorn", "backend.bootstrap.entrypoints.api:create_app", "--host", "${SERVER_HOST}", "--port", "${SERVER_PORT}", "--factory", "--reload" ]
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    container_name: "water_delivery-redis"
    image: redis:8-alpine
    restart: unless-stopped
    env_file:
      - .env
    command: [ "redis-server", "--port", "${REDIS_PORT}", "--requirepass", "${REDIS_PASSWORD}" ]
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli", "-a", "$${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - redis_data:/data

  postgres:
    container_name: "water_delivery-postgres"
    image: postgres:18-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./scripts:/scripts
    env_file:
      - .env
    ports:
      - "${POSTGRES_INTERNAL_PORT}:${POSTGRES_PORT}"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  migration:
    container_name: "water_delivery-migration"
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: on-failure
    env_file:
      - .env
    depends_on:
      admin_bot:
        condition: service_started
      postgres:
        condition: service_healthy
    command: [ "alembic", "upgrade", "head" ]
    volumes:
      - ./backend/src:/usr/src/app/src

  webapp:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    working_dir: /home/node/app
    stop_signal: SIGINT
    volumes:
      - ./frontend:/home/node/app
      - node_modules_volumes:/home/node/app/node_modules
    env_file:
      - .env
    command: [ "npm", "run", "dev", "--host" ]
    depends_on:
      - api
      - admin_bot

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - reverse-proxy

  reverse-proxy:
    depends_on:
      - webapp
      - admin_bot
      - api
    stop_signal: SIGINT
    restart: always
    image: nginx:latest
    volumes:
      - ./nginx/nginx-dev.conf:/etc/nginx/conf.d/default.conf

  otel-collector:
    container_name: "water_delivery-otel-collector"
    image: otel/opentelemetry-collector-contrib:0.117.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./configs/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "${OTEL_COLLECTOR_PORT}:4317"
    restart: unless-stopped

  victoria_metrics:
    container_name: "water_delivery-victoria_metrics"
    image: victoriametrics/victoria-metrics:v1.106.1
    command:
      - "--storageDataPath=/storage"
      - "--httpListenAddr=:8428"
      - "--retentionPeriod=1d"
    volumes:
      - victoria_metrics_data:/storage
    ports:
      - "${VICTORIA_METRICS_PORT}:8428"
    restart: unless-stopped

  grafana:
    container_name: "water_delivery-grafana"
    image: grafana/grafana:11.4.0
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "${GRAFANA_PORT}:3000"
    restart: unless-stopped
    depends_on:
      - victoria_metrics

volumes:
  node_modules_volumes:
  redis_data:
  postgres_data:
  grafana_data:
  victoria_metrics_data:
